# AlienRaid - install file for people who do NOT use Nix.
#
# Nix users: ignore this file. `nix develop` provides python3 + pygame from
# the nix store (see flake.nix); nothing here is used on NixOS.
#
# Without Nix, install the single dependency and run:
#   uv sync
#   .venv/bin/python launcher.py
# or:
#   pip install pygame
#   python launcher.py

[project]
name = "alienraid"
version = "0.1.0"
description = "A roguelike RPG. You are Wrpgnyth, an alien crash-landed in the Australian Outback."
requires-python = ">=3.11"
dependencies = [
    "pygame",
]

[tool.uv]
# Dependency-only install: do not try to build this project as a package.
package = false
